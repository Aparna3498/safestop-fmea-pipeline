name: Build FMEA report

on:
  workflow_dispatch:
    inputs:
      trial_id:
        description: Trial identifier
        required: true
        default: TRIAL-01
        type: choice
        options:
          - TRIAL-01
          - TRIAL-02
          - TRIAL-03

permissions:
  contents: read

jobs:
  generate:
    name: Validate candidates and build report
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source evidence
        run: python src/validate_inputs.py

      - name: Validate ChatGPT-generated candidates
        run: >-
          python -m src.validate_candidates
          "trials/${{ inputs.trial_id }}/fmea_candidates.json"

      - name: Prepare artifact directory
        run: >-
          mkdir -p "outputs/${{ inputs.trial_id }}" &&
          cp "trials/${{ inputs.trial_id }}/fmea_candidates.json"
          "outputs/${{ inputs.trial_id }}/fmea_candidates.json"

      - name: Render human-review report
        run: >-
          python -m src.render_report
          "trials/${{ inputs.trial_id }}/fmea_candidates.json"
          --trial-id "${{ inputs.trial_id }}"
          --output "outputs/${{ inputs.trial_id }}/fmea_report.md"

      - name: Upload trial artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safestop-${{ inputs.trial_id }}
          path: outputs/${{ inputs.trial_id }}/
          if-no-files-found: error
          retention-days: 30
