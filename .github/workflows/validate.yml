name: Validate safety inputs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source evidence
        run: python src/validate_inputs.py

      - name: Check generated JSON Schema
        run: python -m src.export_schema --check

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate committed TRIAL-01 candidates
        run: >-
          python -m src.validate_candidates
          trials/TRIAL-01/fmea_candidates.json

      - name: Test report rendering
        run: >-
          python -m src.render_report
          trials/TRIAL-01/fmea_candidates.json
          --trial-id TRIAL-01
          --output outputs/TRIAL-01/fmea_report.md
